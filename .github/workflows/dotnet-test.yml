name: .NET Testing

on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.0.100-rc.3.26522.148

      - name: Linting
        run: dotnet format --verify-no-changes

      - name: Create Kubernetes Cluster
        uses: helm/kind-action@v1.15.2

      # The admission webhook integration tests serve HTTPS on the runner. The kind API server reaches
      # the runner through the IPv4 gateway of the kind Docker network.
      - name: Configure Webhook Test Host
        run: |
          gateway=$(docker network inspect kind \
            --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' | grep -m1 -E '^[0-9]+(\.[0-9]+){3}$')
          test -n "$gateway"
          echo "KUBEOPS_TEST_WEBHOOK_HOST=$gateway" >> "$GITHUB_ENV"

      # Test projects target net10.0 and net11.0. Both test modules install the same cluster-scoped CRDs,
      # so they must not run in parallel against the shared kind cluster.
      - name: Execute Tests
        run: dotnet test --configuration ${{ runner.debug == '1' && 'Debug' || 'Release' }} --max-parallel-test-modules 1
